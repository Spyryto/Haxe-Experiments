name: Native wxWidgets

on:
  push:
    branches: [main, 'lab/002-*']
    paths:
      - 'experiments/001-haxeui/src/**'
      - 'experiments/002-haxeui-wxwidgets/**'
      - 'experiments/003-hxwidgets-direct/**'
      - '.github/workflows/native-wxwidgets.yml'
  pull_request:
    paths:
      - 'experiments/001-haxeui/src/**'
      - 'experiments/002-haxeui-wxwidgets/**'
      - 'experiments/003-hxwidgets-direct/**'
      - '.github/workflows/native-wxwidgets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Compare HaxeUI vs hxWidgets direct (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC x64 shell
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.7'
      - name: Install Haxe libraries
        run: |
          haxelib install hxcpp 4.3.2 --always --quiet
          haxelib install hxWidgets 1.12.0 --always --quiet
          haxelib install haxeui-core 1.7.0 --always --quiet
          haxelib install haxeui-hxwidgets 1.7.0 --always --quiet
      - name: Fetch wxWidgets sources
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "3.1.3"
          $wx = Join-Path (Get-Location).Path "wxWidgets-$ver"
          $url = "https://github.com/wxWidgets/wxWidgets/releases/download/v$ver/wxWidgets-$ver.tar.bz2"
          Invoke-WebRequest -Uri $url -OutFile wx.tar.bz2
          tar.exe -xjf wx.tar.bz2
          if ($LASTEXITCODE -ne 0) { throw "wxWidgets extraction failed" }
          if (!(Test-Path "$wx/build/msw/makefile.vc")) { throw "wxWidgets makefile missing" }
          "WXWIN=$wx" >> $env:GITHUB_ENV

      - name: Cache built wxWidgets static libraries
        id: wxcache
        uses: actions/cache@v4
        with:
          path: wxWidgets-3.1.3/lib/vc_x64_lib
          key: wx313-msvc-x64-static-v1-${{ runner.os }}
      - name: Compile wxWidgets static (/MD)
        if: steps.wxcache.outputs.cache-hit != 'true'
        run: |
          Push-Location "$env:WXWIN/build/msw"
          try {
            & nmake.exe -f makefile.vc BUILD=release TARGET_CPU=X64 SHARED=0 RUNTIME_LIBS=dynamic
            if ($LASTEXITCODE -ne 0) { throw "wxWidgets static build failed" }
          } finally { Pop-Location }

      - name: Compile native HaxeUI with hxcpp
        run: |
          $clock = [Diagnostics.Stopwatch]::StartNew()
          & haxe experiments/002-haxeui-wxwidgets/native-windows.hxml
          $clock.Stop()
          "hxcpp_compile_seconds=$([math]::Round($clock.Elapsed.TotalSeconds,2))" >> $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { throw "Haxe/hxcpp build failed" }

      - name: Compile CLI baseline for like-for-like size comparison
        run: |
          & haxe experiments/000-cli/native.hxml -D ABI=-MD -D HXCPP_M64
          if ($LASTEXITCODE -ne 0) { throw "CLI baseline hxcpp compilation failed" }
      - name: Compile direct hxWidgets via hxcpp
        run: |
          $clock = [Diagnostics.Stopwatch]::StartNew()
          & haxe experiments/003-hxwidgets-direct/native-windows.hxml
          $clock.Stop()
          "direct_hxcpp_compile_seconds=$([math]::Round($clock.Elapsed.TotalSeconds, 2))" >> $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { throw "Direct hxWidgets build failed" }
      - name: Package, measure and smoke-test GUI process
        run: |
          ./experiments/002-haxeui-wxwidgets/scripts/measure.ps1
      - name: Upload native program and measurements
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: haxeui-wxwidgets-windows-x64
          path: dist/wxwidgets/
          if-no-files-found: error
          retention-days: 30
      - name: Package and measure hxWidgets direct
        run: |
          ./experiments/003-hxwidgets-direct/scripts/measure.ps1
      - name: Upload direct hxWidgets executable and comparison
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hxwidgets-direct-windows-x64
          path: dist/hxwidgets-direct/
          if-no-files-found: error
          retention-days: 30
